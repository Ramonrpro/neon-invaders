<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>NEON INVADERS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        /* Mata pull-to-refresh e o efeito elastico de fim de rolagem. */
        overscroll-behavior: none;
        /* Mata rolagem, pinca e zoom por toque duplo dentro do jogo. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        /* iOS: sem o balao de "copiar/compartilhar" no toque longo. */
        -webkit-touch-callout: none;
      }

      body {
        /*
         * `position: fixed` e' o que impede o Safari de arrastar a pagina
         * inteira quando o dedo escapa do canvas — `overflow: hidden` sozinho
         * nao segura o rubber-band do iOS.
         */
        position: fixed;
        inset: 0;
      }

      #app {
        width: 100%;
        height: 100%;
        /* `dvh` acompanha a barra do navegador aparecendo e sumindo no celular. */
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
